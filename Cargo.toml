[package]
name = "tauri-plugin-multiline-menubar"
version = "0.1.0"
authors = [ "tauri-plugin-multiline-menubar" ]
description = "A Tauri plugin that renders a two-line label in the macOS menu bar."
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-multiline-menubar"

[dependencies]
tauri = { version = "2.11.3" }
serde = "1.0"
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
cc = "1"
