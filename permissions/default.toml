[default]
description = "Default permissions for the multiline-menubar plugin (core rendering + read-only queries). High-impact commands (remove, menu injection, popup window control) are intentionally NOT included — grant them explicitly, e.g. `multiline-menubar:allow-remove`."
permissions = ["allow-create", "allow-set-text", "allow-set-font-sizes", "allow-set-layout", "allow-set-tooltip", "allow-set-visible", "allow-set-colors", "allow-set-bold", "allow-rect", "allow-is-visible", "allow-set-auto-popup"]
