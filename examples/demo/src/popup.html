<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menubar Popup</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .card {
        margin: 12px;
        height: calc(100% - 24px);
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 14px;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.32);
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        color: #1d1d1f;
        overflow-y: auto;
      }
      @media (prefers-color-scheme: dark) {
        .card {
          background: rgba(40, 40, 44, 0.94);
          border-color: rgba(255, 255, 255, 0.08);
          color: #f2f2f7;
        }
      }
      h2 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }
      p {
        margin: 0;
        font-size: 12px;
        opacity: 0.7;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
      }
      input[type="text"] {
        padding: 7px 9px;
        border-radius: 8px;
        border: 1px solid rgba(0, 0, 0, 0.15);
        background: rgba(255, 255, 255, 0.6);
        color: inherit;
        font-size: 13px;
      }
      input[type="color"] {
        padding: 0;
        height: 30px;
        width: 100%;
        border-radius: 8px;
        border: 1px solid rgba(0, 0, 0, 0.15);
        cursor: pointer;
      }
      input[type="range"] {
        width: 100%;
      }
      @media (prefers-color-scheme: dark) {
        input[type="text"] {
          border-color: rgba(255, 255, 255, 0.15);
          background: rgba(0, 0, 0, 0.25);
        }
      }
      fieldset.colors {
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-radius: 10px;
        padding: 8px 10px;
        margin: 0;
        font-size: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      @media (prefers-color-scheme: dark) {
        fieldset.colors {
          border-color: rgba(255, 255, 255, 0.15);
        }
      }
      legend {
        font-size: 11px;
        font-weight: 600;
        opacity: 0.85;
        padding: 0 4px;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      button {
        flex: 1;
        padding: 8px 10px;
        border-radius: 9px;
        border: none;
        background: #0a84ff;
        color: white;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      button.secondary {
        background: rgba(0, 0, 0, 0.12);
        color: inherit;
      }
      .seg-btn {
        background: rgba(0, 0, 0, 0.12);
        color: inherit;
        border-radius: 8px;
      }
      .seg-btn[aria-pressed="true"] {
        background: #0a84ff;
        border-color: #0a84ff;
        color: white;
      }
      @media (prefers-color-scheme: dark) {
        .seg-btn {
          background: rgba(255, 255, 255, 0.12);
        }
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h2 id="popup-header">Instance settings</h2>
      <p>Edit this menubar instance's text and appearance below.</p>

      <div class="field">
        <label for="popup-top">Top label</label>
        <input type="text" id="popup-top" value="人工智能" />
      </div>
      <div class="field">
        <label for="popup-bottom">Bottom value</label>
        <input type="text" id="popup-bottom" value="+4569" />
      </div>
      <div class="row">
        <button id="popup-text-update">Update</button>
        <button id="popup-text-reset" class="secondary">Reset</button>
      </div>

      <fieldset class="colors">
        <legend>Top line color</legend>
        <div class="row" id="popup-top-cmode">
          <button type="button" class="seg-btn" data-cmode="default" aria-pressed="true">System</button>
          <button type="button" class="seg-btn" data-cmode="solid" aria-pressed="false">Custom</button>
        </div>
        <div id="popup-top-solid-row" hidden>
          <div class="field">
            <label for="popup-top-color">Color</label>
            <input type="color" id="popup-top-color" value="#7fd1ff" />
          </div>
          <div class="field">
            <label for="popup-top-hex">Hex (auto-filled, editable)</label>
            <input type="text" id="popup-top-hex" value="#7fd1ff" />
          </div>
        </div>
      </fieldset>

      <fieldset class="colors">
        <legend>Bottom line color</legend>
        <div class="row" id="popup-bottom-cmode">
          <button type="button" class="seg-btn" data-cmode="default" aria-pressed="true">System</button>
          <button type="button" class="seg-btn" data-cmode="solid" aria-pressed="false">Custom</button>
        </div>
        <div id="popup-bottom-solid-row" hidden>
          <div class="field">
            <label for="popup-bottom-color">Color</label>
            <input type="color" id="popup-bottom-color" value="#ffd166" />
          </div>
          <div class="field">
            <label for="popup-bottom-hex">Hex (auto-filled, editable)</label>
            <input type="text" id="popup-bottom-hex" value="#ffd166" />
          </div>
        </div>
      </fieldset>
      <div class="row">
        <button id="popup-colors">Apply colors</button>
        <button id="popup-reset" class="secondary">Reset</button>
      </div>

      <fieldset class="colors">
        <legend>Font size</legend>
        <div class="field">
          <label>Layout</label>
          <div class="row">
            <label><input type="radio" name="popup-layout" id="popup-layout-bottom" value="0" checked /> Small top · Large bottom</label>
            <label><input type="radio" name="popup-layout" id="popup-layout-top" value="1" /> Large top · Small bottom</label>
            <label><input type="radio" name="popup-layout" id="popup-layout-equal" value="2" /> Equal</label>
          </div>
        </div>
        <div id="popup-size-asym">
          <div class="field">
            <label for="popup-large-size">
              Large line (<span id="popup-large-size-value">12</span> pt)
            </label>
            <input
              type="range"
              id="popup-large-size"
              min="8"
              max="16"
              step="1"
              value="12"
            />
          </div>
          <div class="field">
            <label for="popup-small-size">
              Small line (<span id="popup-small-size-value">7</span> pt)
            </label>
            <input
              type="range"
              id="popup-small-size"
              min="5"
              max="11"
              step="1"
              value="7"
            />
          </div>
        </div>
        <div id="popup-size-equal" style="display: none">
          <div class="field">
            <label for="popup-size">
              Size (both lines, <span id="popup-size-value">9</span> pt)
            </label>
            <input
              type="range"
              id="popup-size"
              min="5"
              max="11"
              step="1"
              value="9"
            />
          </div>
        </div>
        <div class="row">
          <button id="popup-sizes">Apply sizes</button>
          <button id="popup-sizes-reset" class="secondary">Reset</button>
        </div>
      </fieldset>

      <fieldset class="colors">
        <legend>Bold</legend>
        <div class="field">
          <label><input type="checkbox" id="popup-top-bold" /> Bold top line</label>
        </div>
        <div class="field">
          <label><input type="checkbox" id="popup-bottom-bold" /> Bold bottom line</label>
        </div>
        <div class="row">
          <button id="popup-bold">Apply bold</button>
          <button id="popup-bold-reset" class="secondary">Reset</button>
        </div>
      </fieldset>

      <fieldset>
        <legend>Font family</legend>
        <div class="field">
          <label for="popup-top-family">Top line family</label>
          <input type="text" id="popup-top-family" placeholder="system font" />
        </div>
        <div class="field">
          <label for="popup-bottom-family">Bottom line family</label>
          <input type="text" id="popup-bottom-family" placeholder="system font" />
        </div>
        <div class="row">
          <button id="popup-font-family">Apply family</button>
          <button id="popup-font-family-reset" class="secondary">Reset</button>
        </div>
      </fieldset>

      <fieldset>
        <legend>Monospaced digits</legend>
        <div class="field">
          <label><input type="checkbox" id="popup-top-monospaced" /> Monospaced top line</label>
        </div>
        <div class="field">
          <label><input type="checkbox" id="popup-bottom-monospaced" /> Monospaced bottom line</label>
        </div>
        <div class="row">
          <button id="popup-monospaced">Apply</button>
          <button id="popup-monospaced-reset" class="secondary">Reset</button>
        </div>
      </fieldset>

      <fieldset>
        <legend>Alignment</legend>
        <div class="field">
          <label for="popup-top-align">Top line</label>
          <select id="popup-top-align">
            <option value="0" selected>Left</option>
            <option value="1">Center</option>
            <option value="2">Right</option>
          </select>
        </div>
        <div class="field">
          <label for="popup-bottom-align">Bottom line</label>
          <select id="popup-bottom-align">
            <option value="0" selected>Left</option>
            <option value="1">Center</option>
            <option value="2">Right</option>
          </select>
        </div>
        <div class="row">
          <button id="popup-alignment">Apply</button>
          <button id="popup-alignment-reset" class="secondary">Reset</button>
        </div>
      </fieldset>

      <div class="row">
        <button id="popup-close" class="secondary">Close</button>
      </div>
    </div>
    <script type="module" src="/popup.js" defer></script>
  </body>
</html>
